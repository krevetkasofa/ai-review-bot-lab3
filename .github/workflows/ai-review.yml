name: ai-review

on:
  pull_request:
    types: [opened, synchronize]

# Один активный запуск на PR: новый коммит отменяет устаревший запуск (экономит токены).
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Минимальные права токена GITHUB_TOKEN: читать код и писать комментарий в PR.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужна история, чтобы посчитать diff base...head
          persist-credentials: false

      - name: Get PR diff (three-dot)
        env:
          # Значения из события передаём через env, а не подставляем в shell-команду:
          # имя ветки контролирует автор PR, подстановка ${{ }} в run: дала бы инъекцию команд.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -c core.quotepath=false diff --no-color --unified=8 \
            "origin/${BASE_REF}...${HEAD_SHA}" \
            -- . ':(exclude)*.lock' ':(exclude)dist/*' ':(exclude)generated/*' > diff.txt
          echo "diff: $(wc -l < diff.txt) lines"

      - name: Install Claude Code CLI
        if: ${{ vars.LLM_BACKEND != 'openai' }}
        run: npm install -g @anthropic-ai/claude-code@2.1.280

      - name: Run review
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Секреты (Settings -> Secrets and variables -> Actions -> Secrets):
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Обычные настройки (вкладка Variables), все необязательные:
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MAX_DIFF_LINES: ${{ vars.MAX_DIFF_LINES }}
          MAX_FILES: ${{ vars.MAX_FILES }}
        run: python3 .github/scripts/review.py diff.txt review.md review.json

      - name: Post comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '⚠️ AI-review: комментарий не сформирован, подробности в логе job.';
            if (fs.existsSync('review.md')) {
              body = fs.readFileSync('review.md', 'utf8');
            }
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n…(обрезано)';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
